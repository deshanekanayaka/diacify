name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: diacify_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run database migrations
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: rootpassword
          MYSQL_DATABASE: diacify_test
        run: |
          for file in backend/database/migrations/00[1-5]_*.sql; do
            echo "Running migration: $file"
            mysql -h 127.0.0.1 -P 3306 -u root -prootpassword diacify_test < "$file"
          done

      - name: Run tests
        env:
          NODE_ENV: test
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 3306
          TEST_DB_USER: root
          TEST_DB_PASSWORD: rootpassword
          TEST_DB_NAME: diacify_test
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          ML_INTERNAL_SECRET: ${{ secrets.ML_INTERNAL_SECRET }}
          ML_SERVICE_URL: http://localhost:8001
        run: npm test
        working-directory: backend

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger backend redeploy
        run: curl --fail -X POST "${{ secrets.RENDER_BACKEND_HOOK }}"
