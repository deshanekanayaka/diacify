name: ML CI

on:
  push:
    branches:
      - main
    paths:
      - 'machine-learning/**'
      - 'docker-compose.yml'
      - '.github/workflows/ml-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'machine-learning/**'
      - 'docker-compose.yml'
      - '.github/workflows/ml-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'machine-learning/requirements.txt'

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: machine-learning

      - name: Train model for tests
        working-directory: machine-learning
        run: python train_model.py

      - name: Run pytest
        env:
          ML_INTERNAL_SECRET: ${{ secrets.ML_INTERNAL_SECRET || 'test_secret' }}
        run: pytest tests/ -v
        working-directory: machine-learning

      - name: Build Docker image for validation
        run: docker build -t diacify-ml:ci .
        working-directory: machine-learning

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: machine-learning
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/diacify-ml:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger ML service redeploy
        run: curl --fail -X POST "${{ secrets.ML_DEPLOY_HOOK }}"
